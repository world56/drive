syntax = "proto3";

package storage;

import "asset.proto";
import "google/protobuf/empty.proto";

option go_package = "api/storage;storagepb";

service StatsService {
  rpc GetSpaceUsage (google.protobuf.Empty) returns (SpaceUsage) {}
}

message SpaceUsage {
  int64 free  = 1;
  int64 total = 2;
  int64 used  = 3;
}