syntax = "proto3";

package asset;

import "google/protobuf/empty.proto";
option go_package = "api/asset;authpb";

service AssetService {
  rpc GetCount (google.protobuf.Empty) returns (Count) {};
  rpc GetRecently (google.protobuf.Empty) returns (Files) {};
  rpc GetFavorite (google.protobuf.Empty) returns (Files) {};
}

message Count {
  map<string, int32> count = 1;
}

message File {
  string id  = 1;
  string fullName = 2;
  string path = 3;
  int32  type = 4;
  int64  count = 5;
}

message Files {
  repeated File data = 1;
}
