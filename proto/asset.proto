syntax = "proto3";

package asset;

import "google/protobuf/empty.proto";

option go_package = "api/asset;assetpb";

service ResourceService {
  // rpc WriteDone (asset.Resource) returns (Resource) {};
  rpc GetResourceInfo (ResourcePrimaryID) returns (asset.Resource) {};
  rpc GetCount (google.protobuf.Empty) returns (Count) {};
  rpc GetRecently (google.protobuf.Empty) returns (Resources) {};
}

service FavoriteService {
  rpc GetFavorite (google.protobuf.Empty) returns (Resources) {};
}

message Count {
  map<string, int64> count = 1;
}

message Resource {
  int64           ID         = 1;
  string          Name       = 2;
  optional int64  ParentID   = 3;
  string          ObjectName = 4;
  int64           Size       = 5;
  optional string FullName   = 6;
  string          Path       = 7;
  int32           Type       = 8;
}

message ResourcePrimaryID {
  string ID = 1;
}

message Resources {
  repeated Resource data = 1;
}
