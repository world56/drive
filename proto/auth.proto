syntax = "proto3";

package auth;
option go_package = "auth/internal/api/auth;authpb";

service UserService {
  rpc GetUserInfo (FindUserId) returns (User) {}
}

service LogService {
  rpc WriteLog(Log) returns (Log) {}
}

message Log {
  string event      = 1;
  string operatorId = 2;
  string desc       = 3;
}

message User {
  string id   = 1;
  string name = 2;
}

message FindUserId {
  string id = 1;
}
