syntax = "proto3";

package auth;
option go_package="./pb";

import "google/protobuf/empty.proto";

message LogInfo {
  string id           = 1;
  string user_id      = 2;
  string user_name    = 3;
  string event        = 4;
  string desc         = 5;
  string create_time  = 6;
  string user_account = 7;
}

message CreateLogReq {
  string event       = 1;
  int64  operator_id = 2;
  string desc        = 3;
}

message GetLogsReq {
  string user_id      = 1;
  string event        = 2;
  int64  page_size    = 3;
  int64  current_page = 4;
}

message GetLogsResp {
  int64            count = 1;
  repeated LogInfo list  = 2;
}

service Log {
  rpc GetLogs (GetLogsReq) returns (GetLogsResp){}
  rpc CreateLog (CreateLogReq) returns (google.protobuf.Empty) {}
}