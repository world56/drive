syntax = "proto3";

package auth;
option go_package="./pb";

import "google/protobuf/empty.proto";

message UserAuthReq {
  string data = 1;
}

message UserAuthTokenResp {
  string token = 1;
}

message LoginUserReq {
  string id = 1;
}

message GetLoginUserResp {
  string id          = 1;
  string name        = 2;
  int32  role        = 3;
  string account     = 4;
}

message ExistsAdminResp {
  bool exists = 1;
}

service Account {
  rpc Login (UserAuthReq) returns (UserAuthTokenResp){}
  rpc Logout  (LoginUserReq) returns (google.protobuf.Empty){}
  rpc Register (UserAuthReq) returns (google.protobuf.Empty){}
  rpc GetLoginUser (LoginUserReq) returns  (GetLoginUserResp){}
  rpc ExistAdmin (google.protobuf.Empty) returns (ExistsAdminResp){}
}
