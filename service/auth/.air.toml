# .air.toml
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # 核心：编译命令，指向你的入口文件
  cmd = "go build -o ./tmp/main ./cmd/server/main.go"
  # 核心：编译后运行哪个二进制文件
  bin = "./tmp/main"
  # 这里的 entrypoint 保持为空字符串或不写，Air 会默认运行 bin 里的路径
  full_bin = ""
  
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "toml", "env"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", ".git"]
  delay = 1000
  stop_on_error = true
  log = "build-errors.log"
  send_interrupt = true
  kill_delay = "500ms"

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true