root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/auth-mq.next . && mv -f ./tmp/auth-mq.next ./tmp/auth-mq"
bin = "./tmp/auth-mq"
full_bin = "./tmp/auth-mq -f etc/auth.yaml"
include_ext = ["go", "yaml", "yml"]
exclude_dir = ["tmp", "vendor"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
cleanup_on_exit = true
