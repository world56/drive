root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/asset-rpc.next . && mv -f ./tmp/asset-rpc.next ./tmp/asset-rpc"
bin = "./tmp/asset-rpc"
full_bin = "./tmp/asset-rpc -f etc/asset.yaml"
include_ext = ["go", "yaml", "yml"]
exclude_dir = ["tmp", "vendor", "client"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
cleanup_on_exit = true
