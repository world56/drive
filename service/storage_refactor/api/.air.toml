root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/storage-api.next . && mv -f ./tmp/storage-api.next ./tmp/storage-api"
bin = "./tmp/storage-api"
full_bin = "./tmp/storage-api -f etc/storage-api.yaml"
include_ext = ["go", "yaml", "yml", "api"]
exclude_dir = ["tmp", "vendor"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true

[misc]
cleanup_on_exit = true
